# Sujet III - v10 fastfix
# Correction performance: nettoyage nonwall rapide par runs + integral image.

nonwall_cleanup:
  enabled: true
  threshold: 245
  action: erase
  fade_gray: 228
  wall_protect_radius_px: 2
  wall_protect_dilate_px: 2
  remove_horizontal_runs: true
  remove_vertical_runs: true
  min_run_length_ratio: 0.010
  min_run_length_px: 22
  strip_radius_px: 3
  max_strip_ink_density: 0.42
  dense_zone_radius_px: 10
  dense_zone_min_density: 0.18
  remove_tiny_components: true
  tiny_component_area_lt: 8
  crop_to_content: true
  crop_margin_px: 34

shadow_225d:
  threshold: 245
  depth_px: 10
  direction_x: 1
  direction_y: 1
  shadow_steps: 10
  shadow_color: '#b9b9b9'
  shadow_alpha_start: 0.30
  shadow_alpha_end: 0.04
  blur_radius: 1.15
  top_line_color: '#050505'
  crop_to_content: true
  crop_margin_px: 34
